<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
 <!-- Global Error Handler: Redirects to 404.html on JS errors -->
 <script>
  function handleError() {
   if (!window.location.pathname.endsWith('404.html')) {
    window.location.href = '404.html';
   }
  }
  window.addEventListener('error', handleError);
  window.addEventListener('unhandledrejection', handleError);
 </script>
 <meta charset="UTF-8" />
 <meta name="viewport" content="width=device-width, initial-scale=1.0" />
 <title>404 &middot; Page Not Found — BalloonAura</title>
 <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23E63946'%3E%3Cellipse cx='12' cy='9' rx='7' ry='8'/%3E%3C/svg%3E" />

 <script src="https://cdn.tailwindcss.com"></script>
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
 <link rel="preconnect" href="https://fonts.googleapis.com">
 <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
 <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,400;1,9..144,600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

 <script>
  tailwind.config = {
   darkMode: 'class',
   theme: {
    extend: {
     colors: {
      'coral':   '#E63946',
      'coral-dk':  '#C42A37',
      'coral-soft': '#FADADD',
      'ink':    '#1D1D2C',
      'cream':   '#FAF7F2',
     },
     fontFamily: {
      display: ['"Fraunces"', 'serif'],
      sans: ['"Outfit"', 'sans-serif'],
     },
    }
   }
  }
 </script>

 <style>
  * { -webkit-tap-highlight-color: transparent; }
  html { font-size: 18px; }

  body {
   font-family: 'Outfit', sans-serif;
   background: #FAF7F2;
   color: #1D1D2C;
   overflow: hidden;
   min-height: 100vh;
   display: flex;
   align-items: center;
   justify-content: center;
   padding: 2rem 1rem;
   position: relative;
  }
  .dark body { background: #12121C; color: #FAF7F2; }

  .font-display {
   font-family: 'Fraunces', serif;
   font-variation-settings: "SOFT" 50, "WONK" 1;
  }

  /* Background blobs */
  body::before {
   content: '';
   position: fixed;
   top: -20%; left: -10%;
   width: 500px; height: 500px;
   background: radial-gradient(circle, rgba(230, 57, 70, 0.12) 0%, transparent 70%);
   border-radius: 50%;
   pointer-events: none;
  }
  body::after {
   content: '';
   position: fixed;
   bottom: -20%; right: -10%;
   width: 500px; height: 500px;
   background: radial-gradient(circle, rgba(230, 57, 70, 0.08) 0%, transparent 70%);
   border-radius: 50%;
   pointer-events: none;
  }
  .dark body::before {
   background: radial-gradient(circle, rgba(230, 57, 70, 0.2) 0%, transparent 70%);
  }
  .dark body::after {
   background: radial-gradient(circle, rgba(230, 57, 70, 0.15) 0%, transparent 70%);
  }

  /* Floating balloons */
  .float-balloon {
   position: fixed;
   opacity: 0.8;
   pointer-events: none;
   animation: bob 5s ease-in-out infinite;
  }
  .float-balloon.b1 { top: 10%; left: 8%; animation-delay: 0s; }
  .float-balloon.b2 { top: 15%; right: 10%; animation-delay: 1s; }
  .float-balloon.b3 { bottom: 15%; left: 12%; animation-delay: 2s; }
  .float-balloon.b4 { bottom: 20%; right: 8%; animation-delay: 1.5s; }

  @media (max-width: 640px) {
   .float-balloon { display: none; }
  }

  @keyframes bob {
   0%, 100% { transform: translateY(0) rotate(-3deg); }
   50% { transform: translateY(-14px) rotate(3deg); }
  }

  /* Giant 404 with balloon as zero */
  .num-404 {
   display: flex;
   align-items: center;
   justify-content: center;
   gap: 0.25rem;
   font-family: 'Fraunces', serif;
   font-weight: 900;
   font-style: italic;
   color: #E63946;
   line-height: 0.85;
   letter-spacing: -0.05em;
   font-size: clamp(5rem, 18vw, 12rem);
  }

  .num-404 .digit {
   display: inline-block;
   text-shadow: 0 20px 40px rgba(230, 57, 70, 0.25);
  }

  /* Balloon as the middle "0" */
  .balloon-0 {
   display: inline-flex;
   align-items: center;
   justify-content: center;
   width: clamp(3.75rem, 12vw, 8.5rem);
   height: clamp(4.75rem, 15vw, 10.5rem);
   position: relative;
   margin: 0 clamp(0.2rem, 0.8vw, 0.5rem);
   transform: translateY(-3%);
  }
  .balloon-0 svg {
   width: 100%;
   height: 100%;
   filter: drop-shadow(0 20px 36px rgba(230, 57, 70, 0.35));
  }
  .balloon-0::after {
   content: '';
   position: absolute;
   bottom: -14px;
   left: 50%;
   transform: translateX(-50%);
   width: 3px;
   height: clamp(18px, 4vw, 36px);
   background: linear-gradient(180deg, #E63946, transparent);
   border-radius: 3px;
   opacity: 0.5;
  }

  /* Buttons */
  .btn-primary {
   background: #E63946;
   color: #FFFFFF;
   font-weight: 600;
   border-radius: 999px;
   letter-spacing: 0.08em;
   text-transform: uppercase;
   font-size: 0.72rem;
   padding: 0.95rem 1.2rem;
   transition: all 0.3s ease;
   display: inline-flex;
   align-items: center;
   gap: 0.5rem;
   box-shadow: 0 8px 20px -8px rgba(230, 57, 70, 0.5);
   white-space: nowrap;
  }
  .btn-primary:hover {
   background: #C42A37;
   transform: translateY(-2px);
   box-shadow: 0 14px 28px -8px rgba(230, 57, 70, 0.6);
  }

  .btn-outline {
   border: 1.5px solid #1D1D2C;
   color: #1D1D2C;
   background: transparent;
   border-radius: 999px;
   font-weight: 600;
   letter-spacing: 0.08em;
   text-transform: uppercase;
   font-size: 0.72rem;
   padding: 0.95rem 1.2rem;
   transition: all 0.3s ease;
   display: inline-flex;
   align-items: center;
   gap: 0.5rem;
   white-space: nowrap;
  }
  .btn-outline:hover {
   background: #1D1D2C;
   color: #FAF7F2;
   transform: translateY(-2px);
  }
  .dark .btn-outline {
   border-color: #FAF7F2;
   color: #FAF7F2;
  }
  .dark .btn-outline:hover {
   background: #FAF7F2;
   color: #1D1D2C;
  }
 </style>
</head>

<body>
<div class="overflow-x-hidden w-full">

 <!-- Floating background balloons -->
 <div class="float-balloon b1">
  <svg width="52" height="72" viewBox="0 0 60 80">
   <ellipse cx="30" cy="26" rx="24" ry="28" fill="#E63946"/>
   <ellipse cx="22" cy="18" rx="6" ry="8" fill="#fff" opacity="0.35"/>
   <path d="M28 54 L30 60 L32 54" fill="#E63946"/>
  </svg>
 </div>
 <div class="float-balloon b2">
  <svg width="46" height="64" viewBox="0 0 60 80">
   <ellipse cx="30" cy="26" rx="24" ry="28" fill="#C42A37"/>
   <ellipse cx="22" cy="18" rx="6" ry="8" fill="#fff" opacity="0.35"/>
   <path d="M28 54 L30 60 L32 54" fill="#C42A37"/>
  </svg>
 </div>
 <div class="float-balloon b3">
  <svg width="42" height="58" viewBox="0 0 60 80">
   <ellipse cx="30" cy="26" rx="24" ry="28" fill="#E63946" opacity="0.7"/>
   <ellipse cx="22" cy="18" rx="6" ry="8" fill="#fff" opacity="0.3"/>
  </svg>
 </div>
 <div class="float-balloon b4">
  <svg width="38" height="52" viewBox="0 0 60 80">
   <ellipse cx="30" cy="26" rx="24" ry="28" fill="#1D1D2C" opacity="0.85"/>
   <ellipse cx="22" cy="18" rx="6" ry="8" fill="#fff" opacity="0.25"/>
  </svg>
 </div>

 <!-- Main content -->
 <main class="relative z-10 text-center max-w-2xl mx-auto w-full">

  <!-- Error pill -->
  <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full border border-coral/25 bg-coral/8 mb-6">
   <i class="fas fa-triangle-exclamation text-coral text-[10px]"></i>
   <span class="text-coral text-[10px] md:text-xs font-bold uppercase tracking-[0.3em]">Error 404</span>
  </div>

  <!-- Giant 404 with balloon -->
  <div class="num-404 mb-6">
   <span class="digit">4</span>
   <span class="balloon-0">
    <svg viewBox="0 0 100 130" xmlns="http://www.w3.org/2000/svg">
     <defs>
      <radialGradient id="balloonGradient" cx="35%" cy="30%" r="70%">
       <stop offset="0%" stop-color="#FF7A85"/>
       <stop offset="50%" stop-color="#E63946"/>
       <stop offset="100%" stop-color="#C42A37"/>
      </radialGradient>
      <radialGradient id="shine" cx="35%" cy="25%" r="30%">
       <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7"/>
       <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
      </radialGradient>
     </defs>
     <ellipse cx="50" cy="45" rx="42" ry="48" fill="url(#balloonGradient)"/>
     <ellipse cx="35" cy="28" rx="14" ry="18" fill="url(#shine)"/>
     <path d="M46 90 L50 100 L54 90 Z" fill="#C42A37"/>
     <path d="M50 100 Q46 112 50 128" stroke="#C42A37" stroke-width="1.5" fill="none" opacity="0.6"/>
    </svg>
   </span>
   <span class="digit">4</span>
  </div>

  <!-- Heading -->
  <h1 class="font-display font-black text-ink dark:text-cream text-2xl sm:text-3xl md:text-4xl lg:text-5xl mb-4 leading-tight">
   This Page Floated
   <span class="italic text-coral">Away.</span>
  </h1>

  <!-- Subtitle -->
  <p class="text-ink/60 dark:text-cream/65 text-sm sm:text-base md:text-lg max-w-md mx-auto leading-relaxed mb-8">
   The page you're looking for doesn't exist or has moved. Let's get you back to the celebration.
  </p>

  <!-- Buttons -->
  <div class="flex flex-col sm:flex-row gap-3 justify-center">
   <a href="index.html" class="btn-primary justify-center">
    <i class="fas fa-house"></i> Back to Home
   </a>
   <a href="contact.html" class="btn-outline justify-center">
    <i class="fas fa-comments"></i> Contact Us
   </a>
  </div>

  <!-- Quick links -->
  <div class="mt-10 pt-6 border-t border-ink/8 dark:border-cream/10">
   <p class="text-[10px] uppercase tracking-[0.3em] text-ink/40 dark:text-cream/40 font-bold mb-4">Popular Pages</p>
   <div class="flex flex-wrap justify-center gap-2">
    <a href="services.html" class="px-4 py-2 rounded-full bg-coral/8 hover:bg-coral hover:text-white text-coral text-[11px] font-bold uppercase tracking-widest transition">Services</a>
    <a href="themes.html" class="px-4 py-2 rounded-full bg-coral/8 hover:bg-coral hover:text-white text-coral text-[11px] font-bold uppercase tracking-widest transition">Themes</a>
    <a href="gallery.html" class="px-4 py-2 rounded-full bg-coral/8 hover:bg-coral hover:text-white text-coral text-[11px] font-bold uppercase tracking-widest transition">Gallery</a>
    <a href="packages.html" class="px-4 py-2 rounded-full bg-coral/8 hover:bg-coral hover:text-white text-coral text-[11px] font-bold uppercase tracking-widest transition">Packages</a>
    <a href="blog.html" class="px-4 py-2 rounded-full bg-coral/8 hover:bg-coral hover:text-white text-coral text-[11px] font-bold uppercase tracking-widest transition">Blog</a>
   </div>
  </div>

 </main>

 <script>
  document.addEventListener('DOMContentLoaded', () => {
   if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');
   if (localStorage.getItem('dir') === 'rtl') document.documentElement.setAttribute('dir', 'rtl');
  });
 </script>

</div>
</body>
</html>
